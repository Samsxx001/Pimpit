# Read at startup. Tray Auto toggle applies to this session.
auto_correct=true
auto_delay_ms=120
switch_layout=true
pause_auto_in_games=true

# GitHub owner/repository. Empty uses the repository built into a release.
update_repo=

# Extra foreground game executables, comma-separated (windowed games supported).
game_exes=

# Additional process names, separated by commas. Password managers are excluded by default.
# Examples: game.exe, WindowsTerminal.exe, Code.exe
exclude=
